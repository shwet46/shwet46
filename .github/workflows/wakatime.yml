
name: Update WakaTime Language Stats

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/scripts/update_wakatime.py"
      - ".github/workflows/wakatime.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate language bars
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: python .github/scripts/update_wakatime.py

      - name: Commit updated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "Update WakaTime language stats"
            git push
          else
            echo "No README changes to commit."
          fi
